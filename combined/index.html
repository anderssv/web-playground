<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <title>HTMX</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Hello">
    <link rel="icon" href="/static/favicon.ico" type="image/x-icon" sizes="any">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <style>
    .htmx-indicator {
        opacity: 0;
        transition: opacity 500ms ease-in;
    }

    .htmx-request .htmx-indicator {
        opacity: 1
    }

    .htmx-request.htmx-indicator {
        opacity: 1
    }

    section {
        margin-bottom: 2em;
    }

    </style>
</head>
<body>
<div style="max-width: 90vw; margin: auto;">
    <header>
        <h1>Header</h1>
    </header>
    <main id="mainContent">
        <section>
            <h1>HTML Element</h1>
            <div style="border: 1px solid red; padding: 10px; margin: 10px;">
                <h1>Todo List</h1>
                <ul id="todo-list">
                    <li>Buy milk</li>
                    <li>Buy bread</li>
                    <li>Buy eggs</li>
                    <li>Buy butter</li>
                </ul>
                <p><span id="html-date"></span></p>
                <script>document.getElementById('html-date').innerHTML = new Date().toLocaleString();</script>
            </div>
        </section> <!-- Plain HTML -->
        <section>
            <h1>HTMX Element</h1>
            <div
                    hx-get="/data/todolist.html"
                    hx-trigger="load delay:1s, click"
                    hx-swap="innerHTML"
                    style="border: 1px solid red; padding: 10px; margin: 10px;">
                Click me!
                <div class="htmx-indicator">
                    Loading... (Intentionally delayed for 1 seconds)
                </div>
            </div>
        </section> <!-- HTMX -->
        <section>
            <h1>Lit Element</h1>
            <div style="border: 1px solid red; padding: 10px; margin: 10px;">
                <script src="/script/lit-script.js" type="module"></script>
                <my-element></my-element>
            </div>
        </section> <!-- Lit -->
        <section>
            <h1>React Element</h1>
            <div id="react-content" style="border: 1px solid red; padding: 10px; margin: 10px;">
                <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
                <script src="/script/react-script.js" type="text/babel" data-type="module"></script>
                React not loaded
            </div>
        </section> <!-- React -->
    </main>
    <footer>This is the footer. - Made by Anders Sveen. Check out <a
            href="https://www.mikill.no">https://www.mikill.no</a></footer>
</div>
</body>
</html>
